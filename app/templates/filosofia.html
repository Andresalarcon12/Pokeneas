<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Pokeneas · Filosofía</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 24px; }
      .card { max-width: 560px; margin: 0 auto; border: 1px solid #ddd; border-radius: 16px; padding: 20px; }
      img { max-width: 100%; border-radius: 12px; display: block; margin: 0 auto 12px; }
      .name { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
      .quote { font-style: italic; margin-top: 8px; }
      .cid { margin-top: 16px; font-size: 0.9rem; color: #555; }
      a { color: inherit; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="name">{{ nombre }}</div>
      <img src="{{ imagen_url }}" alt="Imagen de {{ nombre }}">
      <div class="quote">“{{ frase }}”</div>
      <div class="cid">Container ID: <strong>{{ container_id }}</strong></div>
      <div style="margin-top:12px;">
        <a href="/info">Ver JSON aleatorio (/info)</a>
      </div>
    </div>
  </body>
</html>
